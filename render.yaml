services:
  - type: web
    name: ibox-academy
    runtime: node
    plan: free
    region: frankfurt  # Европа — ближе к РФ, меньше задержек
    buildCommand: npm install && npm run build
    # ffmpeg-static npm package bundles the binary — no system install needed
    startCommand: node dist/server.cjs
    healthCheckPath: /api/bitrix-webhook
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false   # Укажи вручную в Render Dashboard → Environment
      # ── JWT (авторизация вместо Firebase) ──
      - key: JWT_SECRET
        generateValue: true   # Render сгенерирует длинный секрет автоматически
      # ── PostgreSQL (Timeweb) — заполнить в Dashboard ──
      # Раздельные переменные (без URL-кодирования пароля со спецсимволами)
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: 5432
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: DATABASE_CA_CERT
        sync: false   # содержимое .crt сертификата Timeweb (verify-full SSL)
      # ── Разовая миграция данных из Firebase ──
      - key: MIGRATION_KEY
        sync: false   # секрет для запуска /api/migrate-firebase, удалить после миграции
      # ── S3-хранилище (Timeweb) — заполнить в Dashboard ──
      - key: S3_ENDPOINT
        sync: false   # напр. https://s3.twcstorage.ru
      - key: S3_REGION
        sync: false   # напр. ru-1
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # ── Firebase (нужен ТОЛЬКО для разовой миграции старых данных) ──
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
